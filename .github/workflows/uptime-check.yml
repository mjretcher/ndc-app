name: Site uptime check

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC). Free to run on any schedule --
    # GitHub Actions has no minute limit on public repos -- this cadence
    # is just about how long an outage could go unnoticed before this
    # catches it, not cost.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the homepage responds
        run: |
          # The apex domain is a 308 redirect to www on Vercel, so follow
          # redirects (-L) and judge the final response. Retry a couple of
          # times so a single slow edge response does not page anyone.
          code=$(curl -sL -o /dev/null -w "%{http_code}" \
            --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors \
            -A "ndc-uptime-check/1.0 (GitHub Actions)" \
            "https://napoleondivingclub.com/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::napoleondivingclub.com returned HTTP $code instead of 200 after following redirects"
            exit 1
          fi
