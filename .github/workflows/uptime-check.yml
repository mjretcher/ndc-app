name: Site uptime check

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC). Free to run on any schedule --
    # GitHub Actions has no minute limit on public repos -- this cadence
    # is just about how long an outage could go unnoticed before this
    # catches it, not cost.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the homepage responds
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://napoleondivingclub.com/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::napoleondivingclub.com returned HTTP $code instead of 200"
            exit 1
          fi
